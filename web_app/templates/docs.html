<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation | DeepStegAI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .docs-container {
            max-width: 1000px;
            margin: 140px auto 80px;
            padding: 60px;
            background: rgba(10, 15, 25, 0.85);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .markdown-content {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 40px;
            margin-bottom: 20px;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .markdown-content h1 {
            font-size: 2.2rem;
            border-bottom: 2px solid var(--primary-glow);
            padding-bottom: 10px;
        }

        .markdown-content h2 {
            font-size: 1.6rem;
            color: var(--secondary);
            margin-top: 50px;
        }

        .markdown-content h3 {
            font-size: 1.2rem;
            color: #fff;
        }

        .markdown-content p {
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 25px;
            padding-left: 25px;
            color: var(--text-muted);
        }

        .markdown-content li {
            margin-bottom: 12px;
        }

        .markdown-content code {
            background: rgba(34, 211, 238, 0.1);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
        }

        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 25px 0;
            overflow-x: auto;
        }

        pre code {
            background: transparent;
            padding: 0;
            color: #d1d5db;
            line-height: 1.6;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 50px 0;
        }

        .markdown-content strong {
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <nav class="navbar glass">
        <div class="logo"><i class="fa-solid fa-book"></i> DeepStegAI Docs</div>
        <div class="nav-links">
            <a href="/">Back to App</a>
        </div>
    </nav>

    <div class="docs-container glass">
        <div class="markdown-content">
            {{ content | safe }}
        </div>
    </div>
</body>

</html>
