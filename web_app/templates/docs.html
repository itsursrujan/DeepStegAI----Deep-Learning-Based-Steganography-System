<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation | DeepStegAI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .docs-container {
            max-width: 900px;
            margin: 120px auto 50px;
            padding: 40px;
            background: rgba(10, 15, 25, 0.8);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        pre {
            white-space: pre-wrap;
            font-family: 'Consolas', monospace;
            color: #d1d5db;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <nav class="navbar glass">
        <div class="logo"><i class="fa-solid fa-book"></i> DeepStegAI Docs</div>
        <div class="nav-links">
            <a href="/">Back to App</a>
        </div>
    </nav>

    <div class="docs-container glass">
        <div class="markdown-content">
            {{ content | safe }}
        </div>
    </div>
</body>

</html>
